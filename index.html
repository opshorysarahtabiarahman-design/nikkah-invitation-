<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Nikah Invitation</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #120907;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
}

/* Main invitation screen */
.invitation {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #120907;
}

/* Your Canva invitation video */
video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #120907;
}

/* Dark layer before the doors open */
.video-cover {
    position: absolute;
    inset: 0;
    background: #120907;
    z-index: 2;
    transition: opacity 1.2s ease;
}

/* Door area */
.doors {
    position: absolute;
    inset: 0;
    z-index: 5;
    perspective: 1600px;
    cursor: pointer;
}

/* Both halves of the door image */
.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;

    background-image: url("assets/doors.jpg");
    background-repeat: no-repeat;
    background-size: 200% 100%;

    transition:
        transform 1.6s cubic-bezier(.77,0,.18,1),
        opacity 1.6s ease;

    backface-visibility: hidden;
}

/* Left half */
.left-door {
    left: 0;
    background-position: left center;
    transform-origin: left center;
}

/* Right half */
.right-door {
    right: 0;
    background-position: right center;
    transform-origin: right center;
}

/* Opening animation */
.open .left-door {
    transform: rotateY(-105deg);
    opacity: 0;
}

.open .right-door {
    transform: rotateY(105deg);
    opacity: 0;
}

/* Button */
.open-button {
    position: absolute;
    z-index: 10;
    bottom: 7%;
    left: 50%;
    transform: translateX(-50%);

    padding: 14px 28px;

    color: #fff;
    background: rgba(35, 14, 10, 0.85);

    border: 1px solid rgba(255,255,255,.7);
    border-radius: 40px;

    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 2px;

    white-space: nowrap;

    cursor: pointer;

    transition:
        opacity .6s ease,
        transform .3s ease;
}

.open-button:active {
    transform: translateX(-50%) scale(.95);
}

.open .open-button {
    opacity: 0;
    pointer-events: none;
}

/* Small sparkle decorations */
.sparkle {
    margin: 0 7px;
}
</style>
</head>

<body>

<div class="invitation" id="invitation">

    <!-- Invitation video -->
    <video
        id="invitationVideo"
        playsinline
        preload="auto"
        controlslist="nodownload"
    >
        <source src="assets/invitation.mp4" type="video/mp4">
    </video>

    <!-- Cover hiding video until doors open -->
    <div class="video-cover" id="videoCover"></div>

    <!-- Doors -->
    <div class="doors" id="doors">

        <div class="door left-door"></div>
        <div class="door right-door"></div>

    </div>

    <!-- Tap button -->
    <button class="open-button" id="openButton">
        <span class="sparkle">✦</span>
        TAP THE DOORS TO OPEN
        <span class="sparkle">✦</span>
    </button>

</div>

<script>

const invitation = document.getElementById("invitation");
const doors = document.getElementById("doors");
const button = document.getElementById("openButton");
const video = document.getElementById("invitationVideo");
const cover = document.getElementById("videoCover");

let opened = false;

function openInvitation() {

    if (opened) return;

    opened = true;

    /* Start the video immediately */
    video.currentTime = 0;

    video.play().catch(() => {
        /* Some browsers may require a second tap for sound */
    });

    /* Open the doors */
    invitation.classList.add("open");

    /* Remove the dark cover */
    setTimeout(() => {
        cover.style.opacity = "0";
        cover.style.pointerEvents = "none";
    }, 500);
}

/* Tap the button */
button.addEventListener("click", openInvitation);

/* Tap anywhere on the doors */
doors.addEventListener("click", openInvitation);

</script>

</body>
</html>
