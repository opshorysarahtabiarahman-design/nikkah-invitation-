<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      viewport-fit=cover">

<title>Mithila & Sheikh — Nikah Invitation</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #160d09;
}

body {
    overflow: hidden;
}

/* Main invitation screen */
.stage {
    position: relative;

    width: min(100vw, 100vh * 2 / 3);
    height: 100vh;

    margin: auto;

    overflow: hidden;

    background: #160d09;

    perspective: 1800px;
}


/* YOUR CANVA INVITATION VIDEO */
.invitation {
    position: absolute;

    inset: 0;

    background: #160d09;

    z-index: 1;
}

.invitation video {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    opacity: 0;

    transition: opacity 0.3s ease;
}


/* Show video after doors open */
.open .invitation video {
    opacity: 1;
}


/* Door panels */
.door {
    position: absolute;

    inset: 0;

    background-image: url("assets/doors.jpg");
    background-size: cover;
    background-position: center;

    transform-style: preserve-3d;

    transition:
        transform 1.55s cubic-bezier(.18,.78,.12,1),
        filter 1.1s ease;

    z-index: 3;

    cursor: pointer;

    backface-visibility: hidden;
}


/* LEFT DOOR */
.door.left {

    clip-path: polygon(
        21% 30%,
        26% 24%,
        37% 20%,
        50% 19%,
        50% 87%,
        21% 87%
    );

    transform-origin: 50% 53%;
}


/* RIGHT DOOR */
.door.right {

    clip-path: polygon(
        50% 19%,
        63% 20%,
        74% 24%,
        79% 30%,
        79% 87%,
        50% 87%
    );

    transform-origin: 50% 53%;
}


/* OPEN ANIMATION */
.open .door.left {

    transform:
        rotateY(-108deg);

    filter: brightness(0.72);
}


.open .door.right {

    transform:
        rotateY(108deg);

    filter: brightness(0.72);
}


/* Center seam */
.seam {

    position: absolute;

    left: 50%;
    top: 19%;

    width: 2px;
    height: 68%;

    transform: translateX(-50%);

    background: rgba(30,13,6,0.48);

    z-index: 4;

    pointer-events: none;

    transition: opacity 0.5s ease;
}

.open .seam {
    opacity: 0;
}


/* TAP TO OPEN BUTTON */
.openBtn {

    position: absolute;

    z-index: 10;

    left: 50%;
    bottom: 6%;

    transform: translateX(-50%);

    padding: 12px 22px;

    border:
        1px solid rgba(255,255,255,0.75);

    border-radius: 999px;

    color: white;

    background:
        rgba(48,20,14,0.7);

    backdrop-filter: blur(6px);

    font-size: 14px;

    letter-spacing: 0.08em;

    text-transform: uppercase;

    cursor: pointer;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.28);

    transition:
        opacity 0.45s ease,
        transform 0.45s ease;
}


/* Hide button after opening */
.open .openBtn {

    opacity: 0;

    pointer-events: none;

    transform:
        translateX(-50%)
        translateY(12px);
}


/* REPLAY BUTTON */
.replay {

    position: absolute;

    z-index: 20;

    right: 14px;
    top: 14px;

    border: none;

    border-radius: 999px;

    padding: 9px 13px;

    color: white;

    background:
        rgba(35,17,12,0.72);

    cursor: pointer;

    opacity: 0;

    pointer-events: none;
}

.open .replay {

    opacity: 1;

    pointer-events: auto;
}


/* MOBILE */
@media (max-width: 520px) {

    .openBtn {

        font-size: 12px;

        padding:
            11px 18px;
    }

}

</style>
</head>


<body>


<div class="stage" id="stage">


    <!-- YOUR INVITATION VIDEO -->
    <div class="invitation">

        <video
            id="invitationVideo"
            src="assets/invitation.mp4"

            playsinline
            preload="auto"

            aria-label="Wedding invitation">

        </video>

    </div>



    <!-- LEFT DOOR -->

    <div
        class="door left"
        aria-hidden="true">
    </div>



    <!-- RIGHT DOOR -->

    <div
        class="door right"
        aria-hidden="true">
    </div>



    <!-- CENTER SEAM -->

    <div class="seam"></div>



    <!-- OPEN BUTTON -->

    <button
        class="openBtn"
        id="openBtn">

        ✦ Tap the doors to open ✦

    </button>



    <!-- REPLAY -->

    <button
        class="replay"
        id="replayBtn">

        ↻ Replay

    </button>


</div>



<script>


const stage =
    document.getElementById("stage");


const video =
    document.getElementById(
        "invitationVideo"
    );


const openButton =
    document.getElementById(
        "openBtn"
    );


const replayButton =
    document.getElementById(
        "replayBtn"
    );



/*
    OPEN THE DOORS
*/

function openDoors() {

    if (
        stage.classList.contains("open")
    ) {
        return;
    }


    stage.classList.add("open");


    /*
        Wait slightly for the doors
        to start opening, then play
        the Canva invitation.
    */

    setTimeout(() => {

        video.currentTime = 0;

        video.play().catch(() => {

            /*
                Some mobile browsers
                may block sound.

                The video can still play
                muted if necessary.
            */

            video.muted = true;

            video.play();

        });

    }, 700);

}



/*
    REPLAY
*/

function replay() {

    stage.classList.remove("open");

    video.pause();

    video.currentTime = 0;

}



/*
    Tap button
*/

openButton.addEventListener(
    "click",
    openDoors
);



/*
    Tap either door
*/

document
    .querySelectorAll(".door")
    .forEach(door => {

        door.addEventListener(
            "click",
            openDoors
        );

    });



/*
    Replay button
*/

replayButton.addEventListener(
    "click",
    replay
);


</script>
</body>
</html>
