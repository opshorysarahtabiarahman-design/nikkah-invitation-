<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Nikah Invitation</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #120907;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

.invitation {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #120907;
}

/* INVITATION VIDEO */
#invitationVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #120907;
}

/* Dark screen before doors open */
.video-cover {
    position: absolute;
    inset: 0;
    background: #120907;
    z-index: 2;
    opacity: 1;
    transition: opacity 1.2s ease;
    pointer-events: none;
}

/* DOORS */
.doors {
    position: absolute;
    inset: 0;
    z-index: 5;
    perspective: 1600px;
    cursor: pointer;
}

.door {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;

    background-image: url("assets/doors.jpg");
    background-repeat: no-repeat;
    background-size: 200% 100%;

    transition:
        transform 1.6s cubic-bezier(.77,0,.18,1),
        opacity 1.6s ease;

    backface-visibility: hidden;
}

.left-door {
    left: 0;
    background-position: left center;
    transform-origin: left center;
}

.right-door {
    right: 0;
    background-position: right center;
    transform-origin: right center;
}

/* OPENING ANIMATION */
.open .left-door {
    transform: rotateY(-105deg);
    opacity: 0;
}

.open .right-door {
    transform: rotateY(105deg);
    opacity: 0;
}

/* TAP BUTTON */
.open-button {
    position: absolute;
    z-index: 10;

    bottom: 7%;
    left: 50%;

    transform: translateX(-50%);

    padding: 14px 28px;

    color: white;
    background: rgba(35, 14, 10, 0.88);

    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 40px;

    font-family: Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 2px;

    white-space: nowrap;
    cursor: pointer;

    transition:
        opacity 0.6s ease,
        transform 0.3s ease;
}

.open-button:active {
    transform: translateX(-50%) scale(0.95);
}

.open .open-button {
    opacity: 0;
    pointer-events: none;
}

.sparkle {
    margin: 0 7px;
}

/* SOUND BUTTON */
.sound-button {
    position: absolute;
    z-index: 20;

    top: 20px;
    right: 20px;

    width: 48px;
    height: 48px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.7);

    background: rgba(35,14,10,0.8);
    color: white;

    font-size: 20px;
    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    transition: opacity 0.6s ease;
}

.open .sound-button {
    opacity: 1;
    pointer-events: auto;
}
</style>
</head>


<body>

<div class="invitation" id="invitation">

    <!-- VIDEO -->
    <video
        id="invitationVideo"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
    >
        <source src="assets/Nikah.mp4" type="video/mp4">
        Your browser does not support video.
    </video>


    <!-- DARK COVER -->
    <div class="video-cover" id="videoCover"></div>


    <!-- DOORS -->
    <div class="doors" id="doors">

        <div class="door left-door"></div>

        <div class="door right-door"></div>

    </div>


    <!-- OPEN BUTTON -->
    <button class="open-button" id="openButton">
        <span class="sparkle">✦</span>
        TAP THE DOORS TO OPEN
        <span class="sparkle">✦</span>
    </button>


    <!-- SOUND BUTTON -->
    <button class="sound-button" id="soundButton">
        🔊
    </button>

</div>


<script>

const invitation = document.getElementById("invitation");
const doors = document.getElementById("doors");
const openButton = document.getElementById("openButton");

const video = document.getElementById("invitationVideo");
const cover = document.getElementById("videoCover");

const soundButton = document.getElementById("soundButton");

let opened = false;


/* OPEN INVITATION */

function openInvitation() {

    if (opened) return;

    opened = true;

    /* Start from beginning */
    video.currentTime = 0;

    /* Keep video muted initially so iPad/Safari allows playback */
    video.muted = true;

    /* Start video */
    video.play().catch(function(error) {
        console.log("Video could not autoplay:", error);
    });

    /* Open doors */
    invitation.classList.add("open");

    /* Remove dark cover */
    setTimeout(function() {

        cover.style.opacity = "0";

    }, 500);
}


/* BUTTON CLICK */

openButton.addEventListener("click", function(event) {

    event.stopPropagation();

    openInvitation();

});


/* DOOR CLICK */

doors.addEventListener("click", function() {

    openInvitation();

});


/* SOUND BUTTON */

soundButton.addEventListener("click", function(event) {

    event.stopPropagation();

    video.muted = false;

    video.play().catch(function(error) {
        console.log("Sound could not start:", error);
    });

    soundButton.textContent = "🔊";

});

</script>

</body>
</html>
